name: Setup spc
description: Setup spc and spc caching
inputs:
  os:
    description: Operating system (used for caching)
    required: true
  spc-version:
    description: spc version
    required: false
runs:
  using: composite
  steps:
    - name: Cache spc (repo)
      id: cache-spc-repo
      uses: actions/cache@v6
      with:
        key: 'spc-repo-${{ inputs.os }}-${{ inputs.spc-version }}'
        path: spc/
    - name: Clone spc
      if: steps.cache-spc-repo.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
      with:
        repository: 'crazywhalecc/static-php-cli'
        path: spc
        ref: ${{ inputs.spc-version }}
    - name: Install Composer dependencies for spc
      if: steps.cache-spc-repo.outputs.cache-hit != 'true'
      working-directory: 'spc/'
      shell: bash
      run: composer install --no-interactive --no-dev --no-progress --ansi
    - name: Cache spc (php)
      id: cache-spc-php
      uses: actions/cache@v6
      with:
        key: 'spc-php-${{ inputs.os }}-${{ inputs.spc-version }}'
        path: |
          source/
          pkgroot/
          buildroot/
          downloads/
